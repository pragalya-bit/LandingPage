<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Trial Class Companion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Smooth transitions for interactions */
        .step-card { transition: all 0.3s ease; }
        .step-card:hover { transform: translateY(-2px); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen pb-20">

    <div class="sticky top-0 z-50 bg-white/95 backdrop-blur shadow-sm border-b border-slate-200 p-4 mb-6">
        <div class="max-w-3xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-xl font-bold text-slate-900">Trial Class Flow</h1>
                <p class="text-xs text-slate-500 uppercase tracking-wide font-semibold">Standard Operating Procedure</p>
            </div>

            <div class="flex items-center gap-3 bg-slate-100 px-4 py-2 rounded-xl border border-slate-200">
                <i data-lucide="clock" class="w-5 h-5 text-slate-500"></i>
                <span id="timer-display" class="text-2xl font-mono font-bold text-blue-600 w-20 text-center">00:00</span>
               
                <button onclick="toggleTimer()" id="timer-btn" class="px-4 py-1.5 rounded-lg text-sm font-bold bg-green-100 text-green-700 hover:bg-green-200 transition-colors">
                    START
                </button>
               
                <button onclick="resetClass()" title="Reset Class" class="p-2 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-200 transition-colors">
                    <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
    </div>

    <div id="steps-container" class="max-w-3xl mx-auto px-4 space-y-4">
        </div>

    <div class="max-w-3xl mx-auto mt-8 text-center text-slate-400 text-sm">
        <p>Click any card to mark step as complete.</p>
    </div>

    <script>
        // --- DATA ---
        const sopData = [
            { id: 1, time: "5–7 mins", activity: "1. Concept Introduction + Icebreaker", desc: "Introduce core concept with a real-life scenario. Do a quick icebreaker to get the child talking immediately.", tip: "Goal: Build comfort." },
            { id: 2, time: "~7 mins", activity: "2. Guided Practice", desc: "Demonstrate concept using dialogue or live demo. Think aloud while solving.", tip: "Ask checking questions." },
            { id: 3, time: "5–7 mins", activity: "3. Independent Practice", desc: "Student attempts gamified activity. Only intervene if they get stuck.", tip: "Appreciate their effort." },
            { id: 4, time: "~5 mins", activity: "4. Platform Showcase", desc: "Show one advanced activity. Mention PSLE/Curriculum alignment.", tip: "Connect to real world." },
            { id: 5, time: "2–3 mins", activity: "5. Certificate", desc: "Generate and show the trial completion certificate. Explain the next step.", tip: "Celebrate completion!" },
            { id: 6, time: "~5 mins", activity: "6. Q&A with Parent", desc: "Answer questions concisely. Highlight the child's strengths observed.", tip: "Be encouraging." }
        ];

        // --- STATE ---
        let completedSteps = {}; // Stores which IDs are done
        let seconds = 0;
        let isTimerActive = false;
        let timerInterval = null;

        // --- RENDER FUNCTION ---
        function renderSteps() {
            const container = document.getElementById('steps-container');
           
            container.innerHTML = sopData.map(step => {
                const isDone = completedSteps[step.id];
               
                // Styles change based on state
                const cardClass = isDone
                    ? "bg-emerald-50 border-emerald-200"
                    : "bg-white border-slate-200 hover:border-blue-400 hover:shadow-md step-card";
               
                const titleClass = isDone ? "text-emerald-800 line-through" : "text-slate-900";
                const badgeClass = isDone ? "bg-emerald-200 text-emerald-800" : "bg-blue-100 text-blue-800";
                const iconColor = isDone ? "text-emerald-500" : "text-slate-200";
                const iconName = isDone ? "check-square" : "square";

                return `
                <div onclick="toggleStep(${step.id})" class="cursor-pointer border-2 rounded-xl p-5 relative overflow-hidden select-none ${cardClass}">
                    <div class="absolute top-4 right-4 ${iconColor}">
                        <i data-lucide="${iconName}" class="w-8 h-8"></i>
                    </div>

                    <div class="pr-12">
                        <div class="flex items-center gap-3 mb-2">
                            <span class="text-xs font-bold px-2 py-1 rounded ${badgeClass}">
                                ${step.time}
                            </span>
                            <h3 class="text-lg font-bold ${titleClass}">
                                ${step.activity}
                            </h3>
                        </div>
                       
                        <p class="text-base leading-relaxed ${isDone ? 'text-emerald-700 opacity-75' : 'text-slate-600'}">
                            ${step.desc}
                        </p>
                       
                        ${!isDone ? `
                        <div class="mt-3 text-sm text-blue-600 font-medium bg-blue-50 inline-flex items-center px-2 py-1 rounded gap-1 border border-blue-100">
                           <i data-lucide="lightbulb" class="w-3 h-3"></i> Tip: ${step.tip}
                        </div>
                        ` : ''}
                    </div>
                </div>
                `;
            }).join('');

            // Re-initialize icons after HTML update
            lucide.createIcons();
        }

        // --- ACTIONS ---
        function toggleStep(id) {
            if (completedSteps[id]) {
                delete completedSteps[id];
            } else {
                completedSteps[id] = true;
            }
            renderSteps();
        }

        function toggleTimer() {
            const btn = document.getElementById('timer-btn');
           
            if (isTimerActive) {
                // Pause
                clearInterval(timerInterval);
                isTimerActive = false;
                btn.innerText = "RESUME";
                btn.className = "px-4 py-1.5 rounded-lg text-sm font-bold bg-yellow-100 text-yellow-700 hover:bg-yellow-200 transition-colors";
            } else {
                // Start
                isTimerActive = true;
                timerInterval = setInterval(() => {
                    seconds++;
                    updateTimerDisplay();
                }, 1000);
                btn.innerText = "PAUSE";
                btn.className = "px-4 py-1.5 rounded-lg text-sm font-bold bg-red-100 text-red-600 hover:bg-red-200 transition-colors";
            }
        }

        function resetClass() {
            // Stop timer
            clearInterval(timerInterval);
            isTimerActive = false;
            seconds = 0;
           
            // Reset button and display
            document.getElementById('timer-btn').innerText = "START CLASS";
            document.getElementById('timer-btn').className = "px-4 py-1.5 rounded-lg text-sm font-bold bg-green-100 text-green-700 hover:bg-green-200 transition-colors";
            updateTimerDisplay();
           
            // Reset steps
            completedSteps = {};
            renderSteps();
        }

        function updateTimerDisplay() {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            const formatted =
                mins.toString().padStart(2, '0') + ":" +
                secs.toString().padStart(2, '0');
            document.getElementById('timer-display').innerText = formatted;
        }

        // --- INIT ---
        renderSteps();
        lucide.createIcons();
    </script>
</body>
</html>
